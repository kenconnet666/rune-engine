<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <title>迷惘</title>
    <style>
      html,
      body,
      #app {
        height: 100%;
        margin: 0;
      }
      /*
       * 界面的尺寸都用 rem：屏幕小的时候把根字号调小，整套界面就跟着缩。
       * 1920×927 的桌面窗口是 16px，915×412 的手机横屏是 13px（按钮约 36px 高），中间按宽高连续变化。
       */
      html {
        font-size: clamp(13px, 0.55vw + 0.9vh, 16px);
      }
      body {
        overflow: hidden;
        background: #090d12;
        /* 游戏画面上不要长按选字、不要下拉刷新 */
        user-select: none;
        overscroll-behavior: none;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
