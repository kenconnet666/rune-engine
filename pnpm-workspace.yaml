# 逐个写出包族：引擎（packages/）、游戏（games/<名字>/）
packages:
  - packages/*
  - games/miwang/*

# 共享依赖的精确版本；各包用 "catalog:" 引用，升级只改这里。
# 语言与工具的版本跟 vue-tsx-pro 仓库保持一致（用同一个 TSX 编译器和语言服务）
catalog:
  # 界面：Vue 运行时 + vue-tsx-pro 的 TSX 编译器与样式引擎（组件自己写，见 packages/ui）
  vue: 3.5.44
  '@zerodep-dev/vue-tsx-pro-tsx': 0.25.0
  # 内核原生支持的数值与日期：Decimal（精确的十进制，运算在任何引擎上逐位一致）、日历日期（不碰系统时区）
  decimal.js: 10.6.0
  '@internationalized/date': 3.12.4
  # 地图数据与处理（都是 ISC）：world-atlas 是 Natural Earth（公有领域）的 TopoJSON，
  # topojson-client 解出多边形与邻接关系，earcut 把多边形切成三角形
  world-atlas: 2.0.2
  topojson-client: 3.1.0
  '@types/topojson-client': 3.1.5
  '@types/topojson-specification': 1.0.5
  '@types/geojson': 7946.0.16
  earcut: 3.2.4
  # 图标（ISC）：只用它的图标数据，自己画成 SVG
  lucide: 1.72.0
  # 国家与地区的中文名（MIT）：构建地图时按 ISO 代码查
  i18n-iso-countries: 7.14.0
  # 服务端（Cloudflare Workers）：wrangler 在本地起一个和线上同样的运行环境，也用它部署
  wrangler: 4.160.1
  '@cloudflare/workers-types': 5.20261110.1
  # 构建与测试
  vite: 8.3.4
  vitest: 5.0.5
  # 整个仓库只用 TypeScript 7（Go 原生版）。钉在 7.1 的每日构建，与 vue-tsx-pro 同一个版本；7.1 正式版出来后两边一起换
  typescript: 7.1.0-dev.20261104.1
  '@types/node': 24.19.2
  '@webgpu/types': 0.1.74
  oxlint: 1.88.0
  oxlint-tsgolint: 7.0.2004
  prettier: 3.9.10
  '@prettier/plugin-oxc': 0.2.3

# wrangler 带进来的这两个包有安装脚本（核对平台对应的二进制）；不跑也能用，就不让它们在安装时执行代码
allowBuilds:
  esbuild: false
  workerd: false

minimumReleaseAgeExclude:
  # 自己的包（vue-tsx-pro 仓库），发布即用
  - '@zerodep-dev/vue-tsx-pro-tsx'
