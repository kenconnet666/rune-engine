name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 格式、lint、包的边界、类型、测试
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check

  # 确定性：同一批测试在 ARM 上再跑一遍。测试里核对的哈希是在 x64 上算出来的定值，
  # 这里算出不同的数就说明模拟在两种架构上会分叉（两位玩家一个用电脑、一个用手机时会对不上）
  determinism-arm64:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  # 冒烟测试：把游戏构建出来，在无界面的 Chrome 里从头点一遍（主菜单、设置、百科、开局、进化、换边、选地区、存档回放），
  # 打一遍章节，再开两个页面一主一客把联机走一遍、当两台设备把云存档走一遍。运行器上没有显卡，WebGPU 用软件实现的那个。
  # 构建两份：默认的那份没有服务端（房间只在同一个浏览器里通）；带服务端的那份照部署出去的形态起
  # （本机的 Workers 运行环境里，一个地址既是页面也是接口）
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @miwang/client build
      - run: pnpm --filter @miwang/server build:site
      - name: 起服务并跑冒烟测试
        env:
          CHROME_NO_SANDBOX: 1
          WRANGLER_SEND_METRICS: false
        run: |
          # 先测没有服务端的那份
          pnpm --filter @miwang/client exec vite preview --port 4173 --strictPort &
          for attempt in $(seq 1 30); do curl -sf http://localhost:4173/ > /dev/null && break; sleep 1; done
          pnpm smoke http://localhost:4173 --software
          pnpm smoke:chapters http://localhost:4173 --software
          pnpm smoke:online http://localhost:4173 --software
          # 再照部署的形态起带服务端的那份：联机先试直连、再只走中转，然后是云存档
          pnpm --filter @miwang/server preview &
          for attempt in $(seq 1 60); do
            curl -sf http://localhost:8787/ > /dev/null \
              && [ "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8787/api/rooms/x)" = 400 ] && break
            sleep 1
          done
          pnpm smoke:online http://localhost:8787 --software
          pnpm smoke:online http://localhost:8787 --software --relay
          pnpm smoke:cloud http://localhost:8787 --software
